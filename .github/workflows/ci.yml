name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

permissions:
  contents: read

jobs:
  ci:
    name: Type check, Lint, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check — main
        run: npx tsc --noEmit -p apps/main/tsconfig.json

      - name: Type check — umkm
        run: npx tsc --noEmit -p apps/umkm/tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
