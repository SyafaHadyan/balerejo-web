name: Lighthouse

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

permissions:
  contents: read
  statuses: write

jobs:
  lighthouse-main:
    name: Lighthouse - Main site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build main
        run: npm run build --workspace=apps/main

      - name: Remove 404 from Lighthouse scope
        run: rm -f apps/main/out/404.html

      - name: Run Lighthouse CI - main
        run: ./node_modules/.bin/lhci autorun --collect.staticDistDir=apps/main/out
        env:
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lighthouse-umkm:
    name: Lighthouse - UMKM site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build umkm
        run: npm run build --workspace=apps/umkm

      - name: Remove 404 from Lighthouse scope
        run: rm -f apps/umkm/out/404.html

      - name: Run Lighthouse CI - umkm
        run: ./node_modules/.bin/lhci autorun --collect.staticDistDir=apps/umkm/out
        env:
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
